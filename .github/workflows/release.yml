name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Cut over at 0.8.0: the shipped app is the WinUI 3 shell. The MSI keeps the WinForms
      # package's name, UpgradeCode and install folder, so an existing install is upgraded in
      # place and its self-updater (which filters assets on "CodexBarWindows") finds this asset.
      # Scripts/build-installer.ps1 still builds the WinForms MSI for local use.
      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\Scripts\build-installer-winui.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $msi = "Installer\bin\Release\CodexBarWindows-$version-win-x64.msi"
          if (gh release view "${{ github.ref_name }}" *> $null) {
            gh release upload "${{ github.ref_name }}" $msi --clobber
          } else {
            gh release create "${{ github.ref_name }}" $msi --title "CodexBarWindows $version" --notes "CodexBarWindows $version"
          }
